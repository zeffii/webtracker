<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webtracker: preset instrument</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: grid; gap: .25rem; margin: 1rem 0; }
    input[type=range] { width: 100%; }
    output { font-variant-numeric: tabular-nums; }
    #status { opacity: .7; min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Preset instrument</h1>
  <button id="start">Start</button>
  <button id="play" disabled>Play pattern</button>
  <p id="status">Press Start to create the audio engine.</p>

  <label>Filter cutoff <output id="cutoff-out"></output>
    <input id="cutoff" type="range" min="0" max="1" step="0.001" value="0.67">
  </label>
  <label>Filter resonance <output id="res-out"></output>
    <input id="res" type="range" min="0" max="0.95" step="0.001" value="0.3">
  </label>
  <label>Delay mix <output id="mix-out"></output>
    <input id="mix" type="range" min="0" max="1" step="0.001" value="0.25">
  </label>

  <script type="module" src="src/main.js"></script>
</body>
</html>
