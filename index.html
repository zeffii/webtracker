<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webtracker: audio spike</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: grid; gap: .25rem; margin: 1rem 0; }
    input[type=range] { width: 100%; }
    output { font-variant-numeric: tabular-nums; }
    #status { opacity: .7; min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Audio spike</h1>
  <button id="start">Start</button>
  <p id="status">Press Start to create the audio engine.</p>

  <label>Pitch <output id="pitch-out"></output>
    <input id="pitch" type="range" min="0" max="1" step="0.0005" value="0.4">
  </label>
  <label>Level <output id="level-out"></output>
    <input id="level" type="range" min="0" max="0.5" step="0.001" value="0.2">
  </label>

  <script type="module" src="src/main.js"></script>
</body>
</html>
